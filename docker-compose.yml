version: '3.8'

services:
  # Database Container (PostgreSQL 16) - Port 3040 on host
  db:
    image: postgres:16-alpine
    container_name: batik_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: batik_db
    ports:
      - "3040:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d batik_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Machine Learning Service (FastAPI / PyTorch / TensorFlow)
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: batik_ml_service
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    expose:
      - "8000"

  # Backend API Service (Node.js Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: batik_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml_service:8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=batik_db
    depends_on:
      db:
        condition: service_healthy
      ml_service:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads

  # Frontend Web Container (Port 8090 on host -> 90 inside container)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: batik_frontend
    restart: always
    ports:
      - "8090:90"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
